# OpenOCD configuration for STM32F407G-DISC1 (Discovery Board)
# Uses on-board ST-Link/V2 debugger

# Interface: ST-Link/V2 on the Discovery board
source [find interface/stlink.cfg]

# Target: STM32F4x series
source [find target/stm32f4x.cfg]

# Connection settings
transport select hla_swd
adapter speed 4000

# Enable SWO output for ITM trace (optional, requires SWO pin connected)
# tpiu config internal /tmp/swo.log uart off 168000000

# Reset configuration
reset_config srst_only srst_nogate
